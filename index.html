<script id="buildy-preview-diagnostics-v2">(() => {
  try {
    const parentOrigin = new URL(document.referrer).origin;
    if (!['https://trancript.art', 'https://trancript.art', 'https://buildy.ai', 'https://www.buildy.ai'].includes(parentOrigin)) return;
    const loadId = new URL(location.href).searchParams.get('buildy_preview_load');
    if (!loadId || !/^[a-zA-Z0-9_-]{10,64}$/.test(loadId) || window.parent === window) return;
    const documentId = crypto.randomUUID();
    const started = performance.now();
    let sent = 0;
    let observations = 0;
    const seen = new Set();
    function emit(event, details = {}) {
      const key = JSON.stringify([event, details]);
      if (seen.has(key)) return;
      if (event === 'root_observed') {
        if (observations >= 3) return;
        observations++;
      } else {
        if (sent >= 37) return;
        sent++;
      }
      seen.add(key);
      window.parent.postMessage({ type: 'Verbetim_PREVIEW_DIAGNOSTIC', payload: {
        loadId, documentId, event, clientTimestampMs: Date.now(), elapsedMs: Math.round(performance.now() - started), ...details
      }}, parentOrigin);
    }
    function asset(raw) {
      try {
        const url = new URL(raw, location.href);
        if (url.origin !== location.origin || !/^\/(?:node_modules\/\.vite\/deps\/|src\/|@vite\/)[a-zA-Z0-9_./-]+$/.test(url.pathname) || url.pathname.length > 300) return {};
        const version = url.searchParams.get('v');
        return { assetPath: url.pathname, ...(/^[a-fA-F0-9]{1,64}$/.test(version || '') ? { version } : {}) };
      } catch { return {}; }
    }
    window.addEventListener('error', event => {
      const target = event.target;
      if (target && target !== window) {
        const details = asset(target.src || target.href || '');
        if (details.assetPath) emit('resource_error', details);
      } else {
        emit('module_error', asset(event.filename || ''));
      }
    }, true);
    window.addEventListener('unhandledrejection', () => emit('unhandled_rejection'));
    const root = phase => emit('root_observed', { phase, rootHasChildren: Boolean(document.getElementById('root')?.childElementCount) });
    document.addEventListener('DOMContentLoaded', () => root('dom_content_loaded'), { once: true });
    window.addEventListener('load', () => root('load'), { once: true });
    setTimeout(() => root('timeout'), 12000);
    emit('capture_started');
    if (typeof PerformanceObserver !== 'undefined') {
      let resources = 0;
      const observer = new PerformanceObserver(list => {
        for (const entry of list.getEntries()) {
          const details = asset(entry.name);
          if (details.assetPath && entry.responseStatus >= 400) {
            emit('resource_error', { ...details, responseStatus: entry.responseStatus });
          }
          if (details.assetPath?.startsWith('/node_modules/.vite/deps/') && resources < 20) {
            resources++;
            emit('dependency_resource', { ...details, transferSize: entry.transferSize || 0, durationMs: Math.round(entry.duration) });
          }
        }
      });
      observer.observe({ type: 'resource', buffered: true });
      setTimeout(() => observer.disconnect(), 15000);
    }
  } catch { /* Diagnostics must never interrupt the app. */ }
})();</script>
